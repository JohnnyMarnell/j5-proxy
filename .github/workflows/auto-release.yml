name: Auto Release

# Every push to main auto-bumps patch version, tags, and releases.
# For minor/major bumps, manually push a tag like v2.0.0 (release.yml handles it).

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  auto-release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next patch tag
        id: bump
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$LATEST" ]; then
            NEW_TAG="v0.0.1"
          else
            MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "$LATEST → $NEW_TAG"

      - name: Update package.json version
        run: |
          VERSION="${{ steps.bump.outputs.tag }}"
          VERSION="${VERSION#v}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet || git commit -m "chore: bump to $VERSION"
          git push

      - name: Create tag
        run: |
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --ignore-scripts

      - name: Build JS + types
        run: bun run build:all

      - name: Build standalone binaries
        run: |
          mkdir -p dist/binaries
          bun build --compile --target=bun-darwin-arm64  --outfile dist/binaries/j5-proxy-mac-arm64   index.ts
          bun build --compile --target=bun-darwin-x64    --outfile dist/binaries/j5-proxy-mac-x64     index.ts
          bun build --compile --target=bun-linux-x64     --outfile dist/binaries/j5-proxy-linux-x64   index.ts
          bun build --compile --target=bun-linux-arm64   --outfile dist/binaries/j5-proxy-linux-arm64 index.ts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: dist/binaries/*

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
